# Frag-cap and racewar progression settings.
#
# This file is read once during server boot. Restart the server after making
# changes. If the file is missing or a value is invalid, the compiled default
# is retained for that value.
#
# The level_cap database row is live state: the level open to all, the level
# each side has opened beyond it, and when the next level can be unlocked
# (next_update). This file controls what the server does with that state when
# it is read, advanced, or reset. Changing this file does not reset the row.
#
# How the cap advances: once the timer has run out, the next frag by the side
# with more total frags unlocks one more level, for that side only. A spell
# circle level (31, 36, 41, 46, 51, 56) is unlocked for every side at once. If
# both sides have the same total, the first side to frag takes the unlock.
# Each unlock restarts the timer. Only Good and Evil frags unlock levels; every
# other side uses the level open to all.

# -----------------------------------------------------------------------------
# Cap levels
# -----------------------------------------------------------------------------
# cap.floor.level: lowest cap level the server will accept. It is also the
# fallback used if the cap level cannot be read from the database.
cap.floor.level=25

# cap.reset.level: level open to all after a pwipe/reset. The reset also clears
# the timer, so the first qualifying frag of the season unlocks the next level.
cap.reset.level=30

# cap.maximum.level: absolute upper cap for both regular and Hardcore players.
# Keep this at or below 56 unless the shared game maximum is intentionally
# changed elsewhere. Hardcore cannot exceed this value.
cap.maximum.level=56

# -----------------------------------------------------------------------------
# Unlocking a level
# -----------------------------------------------------------------------------
# timer.unlock.days: whole days after an unlock before the next level can be
# unlocked. 0 removes the wait.
timer.unlock.days=3

# unlock.victim.levels.below.open: a frag only unlocks a level when its victim
# is at most this many levels below the level open to all, so killing a
# low-level character cannot unlock one.
unlock.victim.levels.below.open=5

# Minimum individual gain needed to unlock a level, in hundredths of a frag.
# 10 means 0.10 frag. Gains from multiple group members are not added together:
# ordinary 20-versus-1 gains (5 points each before modifiers) do not unlock a level.
# Valid range: 1-100 (0.01-1.00 frag).
unlock.minimum.frag.points=10

# -----------------------------------------------------------------------------
# Hardcore cap lead
# -----------------------------------------------------------------------------
# Hardcore characters may use a cap this many levels above their side's cap
# for experience-cap purposes. Example: cap 54 plus 2 gives Hardcore an
# effective cap of 56. The result is always clamped to cap.maximum.level.
# This is the ONLY configuration key for the Hardcore frag-cap allowance.
hardcore.levels.beyond.cap=2
